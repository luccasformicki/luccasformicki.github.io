<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio</title>
    <script>
      // Tema aplicado ANTES da primeira pintura: sem isto a página nasceria
      // escura e piscaria para o claro depois que o React montasse. Precisa ser
      // inline e síncrono. Mantenha em sincronia com src/theme.jsx — mesma
      // chave, mesmos valores, escuro como padrão.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("portfolio:theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {
          /* localStorage indisponível */
        }
        document.documentElement.dataset.theme = theme;
        // Cobre também o intervalo antes da folha de estilo chegar.
        document.documentElement.style.backgroundColor =
          theme === "light" ? "#ffffff" : "#0d0d0d";
      })();
    </script>
